# The whole backend, on one host (PLAN-5 Phase 11).
#
# ⚠️ **Only Caddy publishes a port.** MySQL and Redis have no `ports:` at all —
# not "bound to 127.0.0.1", not "exposed on a high port", none. They are
# reachable on the `internal` Docker network by service name and nowhere else,
# so no firewall mistake on the host can expose them. The API is the same: Caddy
# reaches it over the network, the internet does not.
#
# This is one VM running one application. There is no OCI Load Balancer in front
# of it and that is a decision, not an omission: a load balancer earns its place
# when it balances across two or more backends, or terminates TLS somewhere the
# application cannot reach. Neither is true. Adding it would drag in a NAT
# gateway (a private subnet has no outbound without one), a Bastion for SSH and
# OCI Certificates with manual rotation — three more things to misconfigure for
# no benefit today. When there is a second VM, the load balancer goes in front
# then and nothing below changes.

# ⚠️ **Memory: this VM is shared, and Gasta has about 3 GB of it.** Another
# project runs on the same instance, so every container here has a hard
# `mem_limit` (there is no swap, so the limit is real RAM). Prod + staging:
#
#     prod      api 896M · mysql 768M · redis 64M · caddy 128M · duckdns 16M
#     staging   api 640M · mysql 512M · redis 64M
#
# 3,088 MiB with everything up. Stopping staging when nobody is using it (see
# RUNBOOK) leaves prod at 1,872 MiB. Raise a limit here only after taking the
# same amount from somewhere else in this file or the staging one.

name: gasta

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume is not fatal —
      # Caddy re-issues — but Let's Encrypt rate-limits by domain, so a
      # container that re-issues on every restart will eventually be refused.
      - caddy_data:/data
      - caddy_config:/config
      # ⚠️ **A second project's sites, served by this Caddy.** The Caddyfile
      # ends with `import /etc/caddy/sites/*.caddy`; that project drops its
      # site blocks in /opt/edge/sites and its static files in /opt/edge/www.
      # Read-only: this container can read them and change neither. Gasta's
      # own site blocks are above the import and do not depend on it.
      - /opt/edge/sites:/etc/caddy/sites:ro
      - /opt/edge/www:/srv/www:ro
    environment:
      # Caddy reads the hostname from here so the same file serves any domain.
      GASTA_DOMAIN: ${GASTA_DOMAIN:?set GASTA_DOMAIN in .env}
      # Let's Encrypt emails this address before a certificate expires.
      GASTA_ACME_EMAIL: ${GASTA_ACME_EMAIL:?set GASTA_ACME_EMAIL in .env}
      # The staging hostname, so Caddy can serve it from the same instance
      # (PLAN-7 §C-1). Defaulted rather than required: a host with no staging
      # stack must still start, and `staging.invalid` is a name that can never
      # resolve, so Caddy asks for no certificate for it.
      GASTA_STAGING_DOMAIN: ${GASTA_STAGING_DOMAIN:-staging.invalid}
    # `edge` is the network the other project's containers join so this Caddy
    # can reach them by name. Created outside compose (`docker network create
    # edge`) and declared external below, so taking this stack down never
    # removes a network another project depends on.
    networks: [internal, edge]
    mem_limit: 128m
    depends_on:
      api:
        condition: service_started

  api:
    # Built from JeevikaService/Dockerfile, which packages a jar built outside
    # the image — see the comment at the top of that file for why.
    image: gasta-api:${GASTA_TAG:-latest}
    build:
      context: ../JeevikaService
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Service names, not addresses. Docker's embedded DNS resolves them on the
      # `internal` network, so nothing here needs to know an IP.
      GASTA_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gasta}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      GASTA_DB_USERNAME: ${MYSQL_USER:?set MYSQL_USER in .env}
      GASTA_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      GASTA_REDIS_HOST: redis
      GASTA_REDIS_PORT: 6379
      GASTA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # The app is not a browser and sends no Origin header, so this matters
      # less than it looks — but application-prod.properties has no default for
      # it on purpose, and a wildcard here would undo that.
      GASTA_ALLOWED_ORIGINS: https://${GASTA_DOMAIN}
      # Push (T11.3). Only set here, never in application.properties: the
      # sender bean is @ConditionalOnProperty on this path, so an unset variable
      # means "no push, log instead" and a set one means the real thing. A blank
      # default would be worse than no default — Spring counts a present-but-
      # empty property as set, and the bean would start and then fail per send.
      # Relaxed binding: this maps straight onto `gasta.push.fcm.credentials`
      # with no entry in any properties file, which is what keeps "unset" a
      # real state rather than an empty string.
      GASTA_PUSH_FCM_CREDENTIALS: /run/gasta/fcm-service-account.json
    # The API must not start before the database can answer. `service_started`
    # would satisfy the dependency the moment mysqld's process exists, which is
    # some seconds before it accepts connections — and Flyway runs immediately,
    # so the API would die on the first migration.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # ⚠️ Read-only, and outside the image. The service-account key can mint
      # tokens for the Firebase project; baking it into the image would put it
      # in every layer cache and every registry that image ever reaches.
      - ${GASTA_FCM_KEY_PATH:-/opt/gasta/fcm-service-account.json}:/run/gasta/fcm-service-account.json:ro
    networks: [internal]
    # The JVM takes 70% of this for heap (MaxRAMPercentage in the Dockerfile),
    # about 627M, leaving ~270M for metaspace, threads and the code cache.
    # ExitOnOutOfMemoryError (also there) makes a full heap a clean restart
    # rather than a JVM limping on.
    mem_limit: 896m

  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    # No `ports:`. See the header.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gasta}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Kolkata
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # The application writes Devanagari and ₹. utf8mb4 is not the default in
      # every 8.0 image variant and a wrong default is discovered as mojibake in
      # somebody's name, months later.
      - --default-time-zone=+05:30
      # Sized for the 768M below. performance_schema alone held 200-300M of
      # the ~550M this used before the cap, for instrumentation nobody reads.
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Authenticated, not `mysqladmin ping`: ping answers as soon as the socket
      # is up, which is true well before the server will accept a login.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:`. See the header.
    #
    # A password even though nothing outside this network can reach it. Redis
    # holds the OTP hashes and the rate-limit counters; "unreachable" and
    # "unauthenticated" are different guarantees, and only one of them survives
    # somebody later adding a `ports:` line in a hurry.
    #
    # maxmemory 40mb under a 64M limit: the gap is for Redis's own overhead and
    # the copy-on-write pages an AOF rewrite's fork touches. Every key here has
    # a TTL, so `volatile-lru` drops the least-recently-used expiring key
    # rather than refusing writes, which would fail every OTP request.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes", "--maxmemory", "40mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    mem_limit: 64m

  # Keeps the DuckDNS record pointing at whatever address this host currently
  # has (PLAN-5 Phase 11).
  #
  # ⚠️ Worth a container rather than a one-time click. An OCI instance keeps its
  # ephemeral public IP while it is running, but a stop/start can hand it a new
  # one — and the symptom of a stale record is not "DNS is wrong", it is the app
  # failing every request *and* Caddy failing to renew the certificate, both
  # silently, some weeks apart from the change that caused it.
  #
  # No image to build: curl in a loop is the whole program. DuckDNS answers
  # literally "OK" or "KO", and it infers the address from the request when
  # `ip=` is empty, which is what makes this five lines instead of fifty.
  duckdns:
    image: curlimages/curl:8.9.1
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:?set DUCKDNS_SUBDOMAIN in .env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          r=$$(curl -fsS "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=" || echo FAILED)
          echo "$$(date -Iseconds) duckdns: $$r"
          sleep 300
        done
    networks: [internal]
    mem_limit: 16m

networks:
  internal:
    driver: bridge
  edge:
    external: true

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
